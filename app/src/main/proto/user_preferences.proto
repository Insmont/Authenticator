syntax = "proto3";

option java_package = "org.insmont.authenticator.core.datastore";
option java_multiple_files = true;

message UserPreferencesProto {
  ThemeConfigProto theme_config = 1;
  bool dynamic_color_enabled = 2;
  bool haptic_feedback_enabled = 3;
  bool app_lock_enabled = 4;
}

enum ThemeConfigProto {
  THEME_CONFIG_UNSPECIFIED = 0;
  THEME_CONFIG_FOLLOW_SYSTEM = 1;
  THEME_CONFIG_LIGHT = 2;
  THEME_CONFIG_DARK = 3;
}